metadata:
  name: "cell_properties_GFI"
  description: "Cell properties based on GFI data"
  version: "1.0.0"
  created: "2026-02-11"

# Cell-specific properties
cell_properties:
  td:
    name: "Doubling Time"
    value: 18 # Average. Frohlich, B., et al. (2025) report a range of 12-24 hours for animal cells under optimized culture
    unit: "h"
    # Used to calculate mu_max
  # mu_max is calculated automatically: ln(2) / td [1/h] max specific growth rate
  cell_diameter:
    name: "Cell Diameter"
    value: 15.0
    unit: "µm"
    # Average diameter of animal cells (Dirk Martens during AC CA 2024)
  cell_density:
    name: "Cell Density"
    value: 1.090
    unit: "g/cm³"
    # Density of animal cells (approximate) Dannhauser, D., et al. (2025)
  wet_cell_mass:
    name: "Wet Cell Mass"
    value: 1000.0e-12
    unit: "g"
    # Estimated wet mass of a single cell 1000 pg WCM per cell. Cell size is a poor proxy for cell mass.
  dry_mass_fraction:
    name: "Dry Mass Fraction"
    value: 0.15
    unit: "-"
    # Fraction of wet cell mass that is dry mass
  protein_fraction:
    name: "Protein Fraction of Dry Mass"
    value: 0.621621621621622
    unit: "-"
    # Fraction of dry mass that is protein
  lipid_fraction:
    name: "Lipid Fraction of Dry Mass"
    value: 0.189189189189189
    unit: "-"
    # Fraction of dry mass that is lipid
  carbohydrate_fraction:
    name: "Carbohydrate Fraction of Dry Mass"
    value: 0.027027027027027
    unit: "-"
    # Fraction of dry mass that is carbohydrate
  nucleic_acid_fraction:
    name: "Nucleic Acids Fraction of Dry Mass"
    value: 0.162162162162162
    unit: "-"
    # Fraction of dry mass that is nucleic acids
  M_biomass:
    name: "Molecular Weight of Biomass"
    value: 21.8472174028545
    unit: "g/Cmol"
    # Average molecular weight of biomass (Humbird-like approximation but using different cellular composition based on GFI data. CH1.59O0.36N0.24). WT & GMO assumed same here, but can vary in sensitivity
  M_protein:
    name: "Molecular Weight of Protein"
    value: 22.4043434376944
    unit: "g/Cmol"
    # Average molecular weight of protein in biomass
  M_AAs_ex_glutamine:  
    name: "Molecular Weight of Amino Acids excluding glutamine"
    value: 112.48402183637
    unit: "g/mol"
    # Calculated as weighted average of the amino acid composition of the protein fraction of biomass, excluding glutamine (which is often a major component of the medium and is to be treated separately in the model).
    # Pseudo Molecular weight, without physical relevance outside this model. Molecular weight is corrected for glutamic acid production as wel, and can be strictly used for mass balancing of the anabolic reaction.
  biomass_C:
    name: "Biomass Carbon Coefficient"
    value: 1
    unit: "mol/Cmol"
    # Empirical biomass composition basis for stoichiometric CHON closure, aligned with the current anabolic reaction coefficients.
  biomass_H:
    name: "Biomass Hydrogen Coefficient"
    value: 1.64100082296572
    unit: "mol/Cmol"
    # Empirical biomass composition basis for stoichiometric CHON closure, aligned with the current anabolic reaction coefficients.
  biomass_O:
    name: "Biomass Oxygen Coefficient"
    value: 0.323460868594766
    unit: "mol/Cmol"
    # Empirical biomass composition basis for stoichiometric CHON closure, aligned with the current anabolic reaction coefficients.
  biomass_N:
    name: "Biomass Nitrogen Coefficient"
    value: 0.214688174401696
    unit: "mol/Cmol"
    # Empirical biomass composition basis for stoichiometric CHON closure, aligned with the current anabolic reaction coefficients.
  Xv_min:
    name: "Minimum Viable Cell Concentration"
    value: 0.5e+9
    unit: "cells/L"
    # Minimum viable cell concentration to prevent washout (0.5e9 cells/L). Below this, the cultivation strategy is considered too risky.  
  # cells_per_mmol is calculated automatically: M_biomass / cell_mass [cells/mmol] conversion factor between cells and mmol biomass
  X_viscosity_limit:
    name: "Cell Concentration Viscosity Limit"
    value: 141e+9
    unit: "cells/L"
    # Cell concentration at which viscosity becomes limiting. Calculated using Humbird (2020) method with max. volume fraction of 0.25.
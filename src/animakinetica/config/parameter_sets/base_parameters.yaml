# Base Parameter Set for AnimaKinetica
# This file contains MANDATORY parameters required for all simulations.
# 
# For complete simulations, combine with kinetics model and operating mode files

metadata:
  name: "base_parameters"
  description: "Base parameter set for Cell culture simulation using the animakinetica package for a STR of 2000L working volume"
  version: "5.0.0"
  created: "2026-06-08"

shared_medium_properties:
  density:
    name: "Density of Culture Medium"
    value: 1000
    unit: "g/L"
    # Approximate density of culture medium
  pH:
    name: "pH of Culture Medium"
    value: 7.2
    unit: "pH"
    # Typical pH of culture medium at start of cultivation
  C_O2:
    name: "Oxygen Concentration in Culture Medium"
    value: 0.21
    unit: "mmol/L"
    # Oxygen concentration in air-saturated medium at 1 atm and 37°C
  C_CT:
    name: "Total Carbon Concentration in Culture Medium"
    value: 29
    unit: "mmol/L"
    # Sum of all carbonate species concentration medium. Automatically equilibrated with CO2 atmosphere.

acid_base_properties:
  acid_concentration:
    name: "Acid Concentration"
    value: 1.0
    unit: "mol/L"
    # Concentration of generic unimolar fully-dissociable strong acid used for pH control
  base_concentration:
    name: "Base Concentration"
    value: 1.0
    unit: "mol/L"
    # Concentration of generic unimolar fully-dissociable strong base used for pH control
  D_base_max:
    name: "Maximum Base Dilution Rate"
    value: 0.005
    unit: "1/h"
    # Maximum base addition (dilution) rate for pH control. 
  D_acid_max:
    name: "Maximum Acid Dilution Rate"
    value: 0.005
    unit: "1/h"
    # Maximum acid addition (dilution) rate for pH control. 
  buffers:
    - name: "Phosphate"
      pKa:
        name: "Phosphate pKa2"
        value: 7.21
        unit: "-"
      C_init:
        name: "Phosphate Initial Concentration"
        value: 0.95     # Typical concentration in DMEM/F12 medium.
        unit: "mmol/L"
      C_feed:
        name: "Phosphate Feed Concentration"
        value: 0.95     # Typical concentration in DMEM/F12 medium.
        unit: "mmol/L"
      type: "monoprotic"


# Basic kinetic parameters shared by all models
kinetics:
  t_lag:
    name: "Lag Phase Duration"
    value: 0 # Assumption. Only relevant directly after thawing.
    unit: "h"
  K_Glc:
    name: "Glucose Monod Constant"
    value: 0.44 # 2x C_Glc_limit; in the order of 0.05 to 0.75 mmol/L for most hybridoma and CHO cells. But very cell line specific. Overall average of literature study from Frohlich, B., et al. (2025) is 1.57.
    unit: "mmol/L"
  K_Gln:
    name: "Glutamine Monod Constant"
    value: 0.28 # 2x C_Gln_limit; in the order of 0.03 to 0.15 mmol/L for most animal cells. But very cell line specific. Overall average of literature study from Frohlich, B., et al. (2025) is 0.44.
    unit: "mmol/L"
  K_O2:
    name: "Oxygen Monod Constant"
    value: 0.000008 # Frohlich, B., et al. (2025) ~0.008 umol/L 
    unit: "mmol/L"
    # Half-saturation constant for oxygen of growth. 
  # Ihibition parameters
  phi_power_decay_Lac:
    name: "Inhibition Power Decay Exponent for Lactate"
    value: 0.4
    unit: "-"
    # Exponent for power decay inhibition model (Frohlich, B., et al. (2025)). Required for power_decay inhibition model
  phi_power_decay_Amm:
    name: "Inhibition Power Decay Exponent for Ammonia"
    value: 0.4
    unit: "-"
    # Exponent for power decay inhibition model (Frohlich, B., et al. (2025)). Required for power_decay inhibition model
  IC50_Lac:
    name: "Lactate IC50"
    value: 39.9 # Frohlich, B., et al. (2025)
    unit: "mmol/L"
  IC100_Lac:
    name: "Lactate IC100"
    value: 72.9 # Frohlich, B., et al. (2025)
    unit: "mmol/L"
  IC50_Amm:
    name: "Ammonia IC50"
    value: 4.08 # Frohlich, B., et al. (2025)
    unit: "mmol/L"
  IC100_Amm:
    name: "Ammonia IC100"
    value: 8.15 # Frohlich, B., et al. (2025)
    unit: "mmol/L"
  IC50_O2:
    name: "Oxygen IC50"
    value: 0.22 #  Frohlich, B., et al. (2025)
    unit: "mmol/L"
    # IC50 for oxygen inhibition of growth.
  C_O2_inh_min:
    name: "Minimum Oxygen Inhibition Concentration"
    value: 0.01 # Frohlich, B., et al. (2025)
    unit: "mmol/L"
    # Below this dissolved oxygen concentration, oxygen inhibition is disabled (IF_O2 = 1).
    # Above this concentration, inhibition follows the standard IC50_O2 / n_O2 model.
  n_O2:
    name: "Oxygen inhibition exponent"
    value: 0.7 # Frohlich, B., et al. (2025)
    unit: "-"
    # Inhibition exponent for oxygen inhibition of growth.
  IC50_CO2:
    name: "Carbon Dioxide IC50"
    value: 6.3 # Frohlich, B., et al. (2025)
    unit: "mmol/L"
    # IC50 for carbon dioxide inhibition of growth.
  IC100_CO2:
    name: "Carbon Dioxide IC100"
    value: 8.6 # Frohlich, B., et al. (2025)
    unit: "mmol/L"
    # IC100 for carbon dioxide inhibition of growth.
  n_CO2:
    name: "Carbon Dioxide inhibition exponent"
    value: 2.3 # Frohlich, B., et al. (2025)
    unit: "-"
    # Inhibition exponent for carbon dioxide inhibition of growth.
  IC50_Osm:
    name: "Osmolality IC50"
    value: 465 # Frohlich, B., et al. (2025)
    unit: "mOsm/kg"
    # IC50 for osmolality inhibition of growth. Effective IC50 is calculated by subtracting Osm_baseline_inhibition (e.g. 300 mOsm/kg). 465-300=165 mOsm/kg increase
  IC100_Osm:
    name: "Osmolality IC100"
    value: 630 # Extrapolated from IC50 and baseline value
    unit: "mOsm/kg"
    # Since linear model is used, IC100 is extrapolated from IC50. IC100 = 2 * IC50 = 2 * 165 = 330 mOsm/kg increase from baseline of 300 mOsm/kg.
  Osm_baseline_inhibition:
    name: "Osmolality Baseline for Inhibition"
    value: 300
    unit: "mOsm/kg"
    # Baseline osmolality to calculate relative osmolality increase for inhibition. Frohlich, B., et al. (2025)

# Reactor design and operation parameters
reactor:
  # pH control parameters
  pH_setpoint:
    name: "pH Setpoint"
    value: 7.2
    unit: "-"
    # Target pH for the culture
  pH_tolerance:
    name: "pH Tolerance"
    value: 0.2
    unit: "-"
    # Acceptable deviation from pH setpoint
  y_CO2_min:
    name: "Minimum CO2 Mole Fraction in Gas"
    value: 0.0004
    unit: "-"
    # Minimum CO2 mole fraction in inlet gas (approx. ambient level)
  y_CO2_max:
    name: "Maximum CO2 Mole Fraction in Gas"
    value: 0.20
    unit: "-"
    # Maximum CO2 mole fraction in inlet gas (enriched air)
  # Reactor dimensions
  V_reactor:
    name: "Reactor Volume"
    value: 2500
    unit: "L"
    # Total reactor volume
  D_reactor:
    name: "Reactor Diameter"
    value: 1.4
    unit: "m"
    # Reactor diameter
  # H_reactor is calculated automatically: (4 * V_reactor) / (pi * D_reactor^2) [m] Reactor height based on volume and diameter
  P_operating:
    name: "Operating Pressure"
    value: 1.2
    unit: "atm"
    # Operating pressure in headspace
  # STR impeller properties
  d_impeller:
    name: "Impeller Diameter"
    value: 0.7 # 0.5x reactor diameter
    unit: "m"
    # Impeller diameter
  power_number:
    name: "Impeller Power Number"
    value: 5.0 # typical for Rushton turbine
    unit: "-"
    # Dimensionless power number for impeller type
  # Gas controller properties
  N_min:
    name: "Minimum Stirrer Speed"
    value: 15
    unit: "rpm"
    # Minimum stirrer speed to maintain mixing
  N_max:
    name: "Maximum Stirrer Speed"
    value: 30
    unit: "rpm"
    # Maximum stirrer speed to avoid shear damage
  Fg_min:
    name: "Minimum Gas Flow Rate"
    value: 0.3
    unit: "L/L/h"
    # Minimum gas flow rate per litre of reactor volume per hour
  Fg_max:
    name: "Maximum Gas Flow Rate"
    value: 0.6
    unit: "L/L/h"
    # Maximum gas flow rate per litre of reactor volume per hour
  y_O2_min:
    name: "Minimum Oxygen Mole Fraction in Gas"
    value: 0.21
    unit: "-"
    # Minimum oxygen mole fraction in inlet gas. At 37degC and 1 atm, this corresponds to air saturation
  y_O2_max:
    name: "Maximum Oxygen Mole Fraction in Gas"
    value: 1
    unit: "-"
    # Maximum oxygen mole fraction in inlet gas (enriched air)
  DO_setpoint:
    name: "Dissolved Oxygen Setpoint"
    value: 0.01 # about 5% of air saturation ~0.002 mmol/L 
    unit: "mmol/L"
    # Target dissolved oxygen concentration. 
  max_fill_fraction:
    name: "Maximum Fill Fraction"
    value: 0.8
    unit: "-"
    # Fraction of reactor volume for max culture volume (V_max)
  batch_init_fraction:
    name: "Initial Batch Fraction"
    value: 0.3
    unit: "-"
    # Fraction of V_max for initial batch volume
  # V_max is calculated automatically: max_fill_fraction * V_reactor [L] Maximum culture volume
  # V_batch_init is calculated automatically: batch_init_fraction * V_max [L] Initial culture volume at start of fed-batch ## OPTIMIZE ##
  F_L_max_specific:
    name: "FB Maximum Specific Feed Flow Rate"
    value: 0.200 # +-5 VVD = 5 L feed per litre of culture per day = 0.208 L/h/L culture
    unit: "L/h/L"
    # Maximum specific feed flow rate; scaled with maximum operating volume. Numerically the same as max dilution rate. This excludes the base dilution rate, which in reality is added to the total flowrate when enabled. Max base dilution rate is defaulted to 5% of F_L_max_specific if not configured (see SimulationParameters) to ensure realistic base flow.

# Initial conditions for simulation
initial_conditions:
  X_inoc:
    name: "Inoculum Concentration"
    value: 6.0e+8
    unit: "cells/L"
    # Inoculum biomass concentration for batch.
  C_Glc_init:
    name: "Initial Glucose Concentration"
    value: 25
    unit: "mmol/L"
  C_Gln_init:
    name: "Initial Glutamine Concentration"
    value: 10
    unit: "mmol/L"
  C_Lac_init:
    name: "Initial Lactate Concentration"
    value: 0
    unit: "mmol/L"
  C_Amm_init:
    name: "Initial Ammonia Concentration"
    value: 0
    unit: "mmol/L"
  C_Na_init:
    name: "Initial base counter-ion concentration"
    value: 0
    unit: "mmol/L"
  # C_O2_init:
  #   name: "Initial Dissolved Oxygen Concentration" 
  #   value: 0.01 # about 5% of air saturation. Should be in line with DO_setpoint.
  #   unit: "mmol/L"
  # If not specified, defaulted to reactor.DO_setpoint.
  C_CT_init:
    name: "Initial Total Carbonate Concentration"
    value: 29 # DMEM/F12 sodium bicarbonate concentration assumed to be in equilibrium with CO2 enriched air to keep the concentration stable.
    unit: "mmol/L"
  C_AA_init:
    name: "Initial Amino Acid Concentration"
    value: 5
    unit: "mmol/L"
    # Initial concentration of total amino acids (excluding glutamine). Total AA concentration in DMEM/F12, ex glutamine.
  pH_init:
    name: "Initial pH"
    value: 7.2
    unit: "-"

# Process timing and scheduling parameters
  osm_bg_init:
    name: "Baseline Osmolality of Culture Medium"
    value: 250
    unit: "mOsm/kg"
    # Typical osmolality of standard culture medium at start of cultivation, excluding main substrates (glucose, glutamine, amino acids, total carbonates) and products (lactate, ammonia). This is used as baseline for calculating osmolality increase for inhibition effects.
process_schedule:
  yearly_uptime:
    name: "Yearly Uptime"
    value: 320
    unit: "days"
    # Available production days per year. Offline time for maintenance,
    # cleaning, holidays, and setup is accounted for outside this horizon.
  max_culture_age:
    name: "Maximum culture age"
    value: 40 # 40 days. This is a conservative estimate for maximum culture age before replacement. In practice, culture age may be limited by factors such as contamination risk, genetic drift, or regulatory guidelines. This parameter is used to trigger culture replacement in all modes to ensure consistent performance and mitigate risks associated with over-aged cultures.
    unit: "days"
    # The maximum age of the culture in days. This is used to trigger culture replacement in all modes.
gas_transfer:
  H_O2:
    name: "Oxygen Henry Constant"
    value: 1.05
    unit: "mmol/L/atm"
    # Oxygen Henry constant at 37°C # Oxygen Henry constant (https://webbook.nist.gov/cgi/cbook.cgi?ID=C7782447&Mask=10#Solubility)
  H_CO2:
    name: "Carbon Dioxide Henry Constant"
    value: 25.05
    unit: "mmol/L/atm"
    # CO2 Henry constant at 37°C (https://webbook.nist.gov/cgi/cbook.cgi?ID=C124389&Mask=10)
  D_L_O2:
    name: "Oxygen Diffusivity"
    value: 2.84e-5
    unit: "cm²/s"
    # Diffusivity of O2 in isotonic saline solution at 37°C (cm²/s)
  D_L_CO2:
    name: "Carbon Dioxide Diffusivity"
    value: 2.0e-5
    unit: "cm²/s"
    # Estimate of diffusivity of CO2 in isotonic brine at 37°C (cm²/s)

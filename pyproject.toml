[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "animakinetica"
version = "1.0.0"
description = "Animal-cell-culture bioprocess simulation framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Ben Tumulero" },
]
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "PyYAML",
    "plotly",
    "xlsxwriter",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
"animakinetica" = [
    "config/**/*.yaml"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/BenTumulero/AnimaKinetica"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "animakinetica"
version = "1.0.0"
description = "Mechanistic animal-cell-culture bioprocess simulation framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Ben Tumulero" },
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "PyYAML",
    "plotly",
    "xlsxwriter",
    "ipykernel"
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
"animakinetica" = [
    "config/**/*.yaml"
]

[tool.setuptools.packages.find]
where = ["src"]
